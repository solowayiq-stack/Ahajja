<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>پنل اکشن</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            cursor: crosshair; /* نشانه‌گیر */
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: sans-serif;
        }
        #gun-ui {
            border: 2px solid #555;
            padding: 20px;
            background: #333;
            border-radius: 10px;
        }
        button {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:active {
            background-color: #b71c1c;
            transform: scale(0.95);
        }
        #status { margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="gun-ui">
        <h2>حالت اکشن</h2>
        <button onclick="fire()">شلیک (Fire)</button>
        <p id="status">وضعیت: آماده</p>
    </div>

    <script>
        function fire() {
            const status = document.getElementById('status');
            status.innerText = "در حال شلیک... پنگ!";
            setTimeout(() => {
                status.innerText = "وضعیت: آماده";
            }, 500);
        }
    </script>
</body>
</html>
